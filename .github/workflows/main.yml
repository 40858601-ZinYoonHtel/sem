name: A workflow for my Hello World App

on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup network
        run: |
          docker network create se-methods
          docker pull mongo:latest
          docker run -d --name mongodb-server --network se-methods mongo:latest

      - name: Check MongoDB container
        run: |
          docker ps
          docker network inspect se-methods

      - name: Wait for MongoDB
        run: |
          echo "Waiting for MongoDB..."
          for i in {1..30}; do
            if docker exec mongodb-server mongosh --eval "db.runCommand({ ping: 1 })" > /dev/null 2>&1; then
              echo "MongoDB is ready"
              break
            fi
            echo "MongoDB is not ready yet..."
            sleep 2
          done

      - name: Build with Maven
        run: mvn package

      - name: Build Docker Image
        run: docker build -t se_methods .

      - name: Run image
        run: docker run --network se-methods --name devopscontainer se_methods

      - name: View logs
        if: always()
        run: docker logs devopscontainer
